# TLS termination + edge caching for 50500
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pay_zone:10m rate=2r/s;
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:20m max_size=1g inactive=7d use_temp_path=off;

server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name 50500.shop;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_stapling on;
  ssl_stapling_verify on;

  client_max_body_size 12m;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  brotli on;
  brotli_types text/plain text/css application/javascript application/json image/svg+xml;

  # Immutable, re-encoded uploads served straight from disk (no Node round-trip).
  location /uploads/ {
    alias /data/uploads/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    types { image/webp webp; image/jpeg jpg jpeg; image/png png; }
    default_type application/octet-stream;
  }

  location /api/payments/ { limit_req zone=pay_zone burst=6 nodelay; proxy_pass http://api:8080; include /etc/nginx/proxy_params_common; }
  location /api/admin/login { limit_req zone=api_zone burst=5 nodelay; proxy_pass http://api:8080; include /etc/nginx/proxy_params_common; }

  location /api/ {
    limit_req zone=api_zone burst=40 nodelay;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_buffering on;
  }

  location / {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache static_cache;
    proxy_cache_valid 200 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    add_header X-Cache-Status $upstream_cache_status;
  }
}
