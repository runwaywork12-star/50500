services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: store50500
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store50500"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Never expose Postgres to the internet.
    expose: ["5432"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://store:${POSTGRES_PASSWORD}@db:5432/store50500
      PGSSL: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    expose: ["8080"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads:/data/uploads:ro
    depends_on: [api]

volumes:
  pgdata:
  uploads:
